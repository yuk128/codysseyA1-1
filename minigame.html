<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    
    <title>낙서장</title>


    <style>

    </style>
</head>
<body>
    <h1>낙서장</h1>
    <button onclick="minifunc()">버튼</button>
    <div id="box"></div>


    <script>
        const box = document.getElementById("box");
        let count = 0;
        minifunc = () => {
    count++;
    box.innerHTML = `버튼이 눌렸습니다. (${count.toString(2)})<br>`;

    // 0부터 4까지 5번 반복
    for (let i = 0; i < 10; i++) {
        // Math.floor로 정수 나눗셈 처리 후 2로 나눈 나머지 계산
        const repeatCount = Math.floor(count / Math.pow(2, i)) % 2;
        box.innerHTML += `${i} ${"*".repeat(repeatCount)}<br>`;
    }

    if (count % 10 === 0) {
        box.innerHTML += "우와!";
    }
}

    </script>
</body>
</html>
